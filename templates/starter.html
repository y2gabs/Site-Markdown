<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Alpha-aware OKLCH bridge — makes bg-accent/10, text-ink/70 etc. work. */
  const withAlpha = (v) => ({ opacityValue }) =>
    opacityValue === undefined ? `oklch(var(${v}))` : `oklch(var(${v}) / ${opacityValue})`;

  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ground: withAlpha('--ground'),   surface: withAlpha('--surface'),
          ink:    withAlpha('--ink'),      muted:   withAlpha('--muted'),
          line:   withAlpha('--line'),     accent:  withAlpha('--accent'),
          'accent-ink': withAlpha('--accent-ink'),
        },
        fontFamily: {
          display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
          sans:    ['"Work Sans"', 'system-ui', 'sans-serif'],
        },
        fontSize: {
          'display-xl': ['clamp(3rem, 8vw, 7rem)',         { lineHeight: '0.95', letterSpacing: '-0.03em' }],
          'display-lg': ['clamp(2.5rem, 6vw, 5rem)',       { lineHeight: '1.0',  letterSpacing: '-0.025em' }],
          'display-md': ['clamp(2rem, 4.5vw, 3.5rem)',     { lineHeight: '1.08', letterSpacing: '-0.02em' }],
          'display-sm': ['clamp(1.5rem, 3vw, 2.25rem)',    { lineHeight: '1.2',  letterSpacing: '-0.01em' }],
          'body-lg':    ['clamp(1.05rem, 1.4vw, 1.25rem)', { lineHeight: '1.65' }],
          'overline':   ['0.75rem', { lineHeight: '1', letterSpacing: '0.18em' }],
        },
        transitionTimingFunction: {
          'out-expo':    'cubic-bezier(0.16, 1, 0.3, 1)',
          'out-quart':   'cubic-bezier(0.25, 1, 0.5, 1)',
          'in-out-soft': 'cubic-bezier(0.65, 0, 0.35, 1)',
        },
        transitionDuration: { 400: '400ms', 600: '600ms', 800: '800ms' },
        boxShadow: {
          soft: '0 8px 24px -12px oklch(22% 0.03 75 / 0.14)',
          lift: '0 24px 60px -20px oklch(22% 0.03 75 / 0.20)',
          glow: '0 0 48px -8px oklch(var(--accent) / 0.35)',
        },
        maxWidth: { measure: '65ch', headline: '18ch' },

  };
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ══ Replace with real photography. Seeded so layout stays stable. ══════ */
const IMG = {
  hero:    'https://picsum.photos/seed/soundbath-hero/1920/1280',
  studio:  'https://picsum.photos/seed/soundbath-studio/1200/1500',
  bowls:   'https://picsum.photos/seed/soundbath-bowls/1200/900',
  session: 'https://picsum.photos/seed/soundbath-session/1200/900',
  group:   'https://picsum.photos/seed/soundbath-group/1200/900',
};

/* ══ Hooks (see 07-react-tailwind-snippets.md) ═════════════════════════ */
const useScrollY = () => {
  const [y, setY] = useState(0);
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { setY(window.scrollY); ticking = false; });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return y;
};

const usePrefersReducedMotion = () => {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReduced(mq.matches);
    const on = (e) => setReduced(e.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, []);
  return reduced;
};

const useInView = (options) => {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window)) { setInView(true); return; }
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.unobserve(el); }
    }, Object.assign({ threshold: 0.15, rootMargin: '0px 0px -10% 0px' }, options || {}));
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
};

/* ══ Primitives ════════════════════════════════════════════════════════ */
const Reveal = ({ children, delay = 0, y = 24, className = '' }) => {
  const [ref, inView] = useInView();
  const reduced = usePrefersReducedMotion();
  const show = inView || reduced;
  return (
    <div ref={ref}
      className={'transition-[opacity,transform] duration-800 ease-out-expo ' + className}
      style={{
        opacity: show ? 1 : 0,
        transform: show ? 'none' : 'translate3d(0,' + y + 'px,0)',
        transitionDelay: reduced ? '0ms' : delay + 'ms',
      }}>
      {children}
    </div>
  );
};

/* Heading entrance — see 04-motion.md §11 and 07-react-tailwind-snippets.md §24.
   Direction comes from the observer entry's own rect (free, no layout thrash);
   reveal still fires exactly once. */
const useDirectionalReveal = ({ threshold = 0.25, rootMargin = '0px 0px -10% 0px' } = {}) => {
  const ref = useRef(null);
  const [state, setState] = useState({ shown: false, from: 'below' });

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window)) { setState({ shown: true, from: 'below' }); return; }

    const obs = new IntersectionObserver((entries) => {
      const entry = entries[entries.length - 1];
      const from = entry.boundingClientRect.top < 0 ? 'above' : 'below';
      if (entry.intersectionRatio >= threshold) {
        setState({ shown: true, from });
        obs.unobserve(el);
      } else {
        setState((s) => (s.shown || s.from === from ? s : { shown: false, from }));
      }
    }, { threshold: [0, threshold], rootMargin });

    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold, rootMargin]);

  return [ref, state.shown, state.from];
};

const LineReveal = ({ lines, as: Tag = 'h2', className = '', delay = 0, stagger = 100, duration = 900 }) => {
  const [ref, shown, from] = useDirectionalReveal();
  const reduced = usePrefersReducedMotion();
  const visible = shown || reduced;
  const hiddenY = from === 'above' ? '-100%' : '100%';

  return (
    <Tag ref={ref} className={className}>
      {lines.map((line, i) => (
        /* pb/-mb pair keeps the clip below the descender line without shifting layout. */
        <span key={i} className="block overflow-hidden pb-[0.12em] -mb-[0.12em]">
          <span className="block will-change-transform"
            style={{
              transform: visible ? 'translate3d(0,0,0)' : 'translate3d(0,' + hiddenY + ',0)',
              transition: visible && !reduced
                ? 'transform ' + duration + 'ms cubic-bezier(0.16, 1, 0.3, 1) ' + (delay + i * stagger) + 'ms'
                : 'none',
            }}>
            {line}
          </span>
        </span>
      ))}
    </Tag>
  );
};

const Overline = ({ children, className = '' }) => (
  <p className={'text-overline uppercase font-medium text-accent ' + className}>

const Button = ({ as: Tag = 'a', variant = 'primary', className = '', children, ...rest }) => {

    onDark:  'bg-surface text-ink hover:-translate-y-0.5 hover:shadow-lift',

  return <Tag className={base + ' ' + variants[variant] + ' ' + className} {...rest}>{children}</Tag>;
};

          <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="1.5">

      {open && (

        </ul>

};

/* ══ Hero — parallax + mandatory scrim ═════════════════════════════════ */
/* Pinned Hero — fixed to the viewport (not sticky, no dead scroll space), content eases
   out on the way down and back in on the way up because it's a live function of scrollY,
   never a one-time reveal. See 04-motion.md §9 and 07-react-tailwind-snippets.md §6
   (PinnedHero). Requires <main> below to start at mt-[100vh] — see App. */
const Hero = () => {
  const scrollY = useScrollY();
  const reduced = usePrefersReducedMotion();
  const [wide, setWide] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(min-width: 768px)');
    setWide(mq.matches);
    const on = (e) => setWide(e.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, []);
  const parallax = wide && !reduced ? scrollY * 0.28 : 0;

  /* Derived every render from the same scrollY already tracked above — no extra state,
     no second scroll listener. smoothstep gives the fade an eased shape (slow-fast-slow)
     instead of a raw linear ratio; being symmetric it eases out scrolling down and eases
     back in scrolling up automatically. See 04-motion.md §9. Divisors are tuning knobs:
     600 = fully faded by 600px of scroll, 2000 = settles at 0.9 scale, never smaller. */
  const smoothstep = (t) => t * t * (3 - 2 * t);
  const fadeT = Math.min(1, Math.max(0, scrollY / 600));
  const scaleT = Math.min(1, Math.max(0, scrollY / 2000));
  const opacity = reduced ? 1 : 1 - smoothstep(fadeT);
  const scale = reduced ? 1 : 1 - 0.1 * smoothstep(scaleT);

  return (
    <section className="fixed inset-0 z-0 h-screen w-full overflow-hidden pointer-events-none">
      <img src={IMG.hero} alt=""
           className="absolute inset-0 -z-20 h-[125%] w-full object-cover"
           style={{ transform: 'translate3d(0,' + parallax + 'px,0)', willChange: 'transform' }} />
      <div className="absolute inset-0 -z-10 bg-gradient-to-r from-ink/70 via-ink/40 to-ink/20" />

      {/* Mobile anchors the card in the upper third and centers its text; desktop centers
          the card vertically, lifts it slightly, and left-aligns. See 06-ui-ux-accessibility.md
          §8 for why these diverge. The opacity/scale transform below is the scroll-linked
          fade — deliberately inline, not a Tailwind transition class, since a CSS transition
          would fight per-frame scroll updates. */}
      <div className="relative mx-auto flex h-full w-full max-w-6xl items-start
                      justify-center px-6 pt-[20vh] text-center md:items-center
                      md:justify-start md:-translate-y-8 md:pt-0 md:text-left"
           style={{ opacity: opacity, transform: 'scale(' + scale + ')',
                    transformOrigin: wide ? 'left center' : 'center' }}>
        <div className="w-full rounded-3xl border border-white/15 bg-ink/75 p-6
                        shadow-lift backdrop-blur-xl pointer-events-auto sm:p-8 md:w-[55%] md:p-12">
          <h1 className="font-display text-display-xl text-balance text-white">
            Quiet the noise <em className="italic">you've stopped noticing</em>
          </h1>
          <p className="mx-auto mt-8 max-w-measure text-body-lg text-pretty text-white/80 md:mx-0">
            Sound baths at Infinessence use tuned bowls and gong resonance to slow the nervous
            system into the same state as deep sleep — in 60 minutes, lying still, doing nothing.
          </p>
          <div className="mt-10 flex flex-row justify-center gap-3 md:justify-start">
            <Button href="#book" className="group">
              <span className="sm:hidden">Book</span>
              <span className="hidden sm:inline">Reserve Your First Session</span>
              <Arrow />
            </Button>
            <Button href="#approach" variant="onDark">
              <span className="sm:hidden">Sessions</span>
              <span className="hidden sm:inline">See how a session works</span>
            </Button>
          </div>
          <p className="mt-6 text-sm text-white/60">
            First session $50 · No experience needed · Mats and blankets provided
          </p>
        </div>
      </div>
    </section>
  );
};

const CountUp = ({ end, suffix = '' }) => {
  const [ref, inView] = useInView({ threshold: 0.4 });
  const reduced = usePrefersReducedMotion();
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!inView) return;
    if (reduced) { setV(end); return; }
    let raf, start;
    const step = (t) => {
      if (start === undefined) start = t;
      const p = Math.min((t - start) / 1600, 1);
      setV(Math.round(end * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [inView, end, reduced]);
  return <span ref={ref} className="tabular-nums">{v.toLocaleString()}{suffix}</span>;
};

/* Floating support widget — demo only, canned keyword replies, never a real API call.
   Mobile is a centered, viewport-clamped overlay rather than an edge-anchored fixed-width
   panel, which would overflow off the opposite edge on a narrow phone. See
   06-ui-ux-accessibility.md §8 and 07-react-tailwind-snippets.md §25. */
const CHAT_REPLY_FALLBACK = "Thanks for reaching out! Call us at (403) 555-0148 or use the Reserve button above.";
const getChatReply = (text) => {
  const t = text.toLowerCase();
  if (t.includes('hour') || t.includes('open')) return 'We hold sessions Wednesday through Sunday, 10am to 7pm.';
  if (t.includes('price') || t.includes('cost')) return 'Sessions range from $50 for a group sound bath to $150 for the full workshop.';
  if (t.includes('where') || t.includes('address')) return 'We\'re in Calgary, Alberta — the exact studio address is sent after booking.';
  return CHAT_REPLY_FALLBACK;
};

const ChatWidget = () => {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { sender: 'agent', text: 'Hi — welcome to Infinessence. Ask me about sessions, pricing, or hours.' },
  ]);
  const [input, setInput] = useState('');

  const send = (e) => {
    e.preventDefault();
    const text = input.trim();
    if (!text) return;
    setMessages((m) => m.concat([{ sender: 'user', text }]));
    setInput('');
    setTimeout(() => {
      setMessages((m) => m.concat([{ sender: 'agent', text: getChatReply(text) }]));
    }, 700);
  };

  return (
    <div className="fixed bottom-6 right-6 z-[90]">
      {!open && (
        <button onClick={() => setOpen(true)} aria-label="Open chat assistant"
                className="grid h-14 w-14 place-items-center rounded-full bg-accent
                           text-accent-ink shadow-lift transition-transform duration-300
                           hover:scale-105">
          <svg viewBox="0 0 24 24" className="h-6 w-6" fill="none" stroke="currentColor" strokeWidth="1.75">
            <path d="M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </button>
      )}

      {open && (
        <div className="fixed inset-x-4 bottom-6 h-[70vh] max-h-[480px]
                        sm:inset-x-auto sm:left-auto sm:right-6 sm:bottom-6 sm:h-[450px] sm:w-96
                        flex flex-col overflow-hidden rounded-3xl border border-line bg-surface
                        shadow-lift">
          <div className="flex items-center justify-between bg-accent p-4 text-accent-ink">
            <div className="flex items-center gap-3">
              <span className="h-2.5 w-2.5 rounded-full bg-emerald-400" aria-hidden="true" />
              <h4 className="font-display text-sm font-semibold">Studio Assistant</h4>
            </div>
            <button onClick={() => setOpen(false)} aria-label="Close chat"
                    className="text-lg font-bold text-accent-ink/80 hover:text-accent-ink">×</button>
          </div>

          <div className="flex-1 space-y-3 overflow-y-auto bg-ground/50 p-4">
            {messages.map((m, i) => (
              <div key={i} className={'flex ' + (m.sender === 'user' ? 'justify-end' : 'justify-start')}>
                <div className={'max-w-[80%] rounded-2xl p-3 text-xs leading-relaxed ' +
                  (m.sender === 'user' ? 'bg-accent text-accent-ink' : 'border border-line bg-surface text-ink')}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <form onSubmit={send} className="flex gap-2 border-t border-line bg-surface p-3">
            <input value={input} onChange={(e) => setInput(e.target.value)}
                   placeholder="Type a message…"
                   className="min-h-[44px] flex-1 rounded-xl bg-ground px-3 text-xs
                              focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" />
            <button type="submit" aria-label="Send"
                    className="grid h-11 w-11 shrink-0 place-items-center rounded-xl
                               bg-accent text-accent-ink">
              <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.75">
                <path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </button>
          </form>
        </div>
      )}
    </div>
  );
};
